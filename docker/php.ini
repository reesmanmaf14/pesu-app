; Pesu's PHP settings for the container (added after php.ini-production).
; Photos are resized to 320px before upload and recordings are at most 1 MB.
upload_max_filesize = 4M
post_max_size = 8M
memory_limit = 128M
expose_php = Off

; The code never changes inside a running container.
opcache.enable = 1
opcache.validate_timestamps = 0
